# Local services for BuildTrack development.
#   docker compose up -d        start PostgreSQL (with pgvector) and Mailpit
#   docker compose down         stop them (data is kept in the volume)
#   docker compose down -v      stop them and delete all data
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildtrack
      POSTGRES_PASSWORD: buildtrack
      POSTGRES_DB: buildtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildtrack -d buildtrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email the app sends. Open http://localhost:8025 to read them.
  # To use it, set SMTP_HOST=localhost and SMTP_PORT=1025 in apps/api/.env
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
