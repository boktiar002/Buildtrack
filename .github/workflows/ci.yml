name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buildtrack
          POSTGRES_PASSWORD: buildtrack
          POSTGRES_DB: buildtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildtrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://buildtrack:buildtrack@localhost:5432/buildtrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: API tests (unit, API and AI-failure tests)
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          API_URL: http://localhost:4000
